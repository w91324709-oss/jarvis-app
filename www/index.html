<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title>
<style>
html,body{margin:0;height:100%;background:#020810;color:#7fdcff;font-family:monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
.core{width:40vw;height:40vw;max-width:220px;max-height:220px;border-radius:50%;background:radial-gradient(circle,#bff4ff,#1e90ff 45%,transparent 72%);box-shadow:0 0 60px #1e90ff,0 0 120px #1e90ff;animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(.9)}50%{transform:scale(1.1)}}
h1{letter-spacing:.4em;font-size:20px;margin:26px 0 10px}
button{background:#0b2a4a;color:#bff4ff;border:1px solid #1e90ff;border-radius:24px;padding:14px 28px;font-size:18px;font-family:monospace}
#out{margin-top:18px;min-height:60px;max-width:90vw;font-size:15px;word-wrap:break-word}
</style></head><body>
<div class="core"></div><h1>J.A.R.V.I.S.</h1>
<button id="talk">Tap to talk</button>
<div id="out">Ready.</div><script>
const out=document.getElementById('out');
const SR=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition;
function say(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
document.getElementById('talk').onclick=async()=>{
  if(!SR){out.textContent='Speech plugin not found.';return}
  try{
    await SR.requestPermissions();
    out.textContent='Listening...';
    const r=await SR.start({language:'en-US',maxResults:1,prompt:'Say something',partialResults:false,popup:true});
    const heard=(r&&r.matches&&r.matches[0])||'';
    out.textContent=heard?('You said: '+heard):'I heard nothing.';
    if(heard) say('You said '+heard);
  }catch(e){out.textContent='Error: '+(e.message||e)}
};
</script></body></html>
<script>
function say(t){
  const T=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech;
  if(!T){out.textContent='Voice plugin not found.';return}
  T.speak({text:t,lang:'en-US',rate:1.0,pitch:1.0,volume:1.0}).catch(e=>{out.textContent='Speak error: '+(e.message||e)});
}
</script>
<script>
const GURL='https://api.groq.com/openai/v1/chat/completions';
async function brain(q){
  let k=localStorage.getItem('gk');
  if(!k){k=(prompt('Paste your Groq key (kept only on this phone):')||'').trim();if(!k)throw new Error('No key entered');localStorage.setItem('gk',k)}
  const r=await fetch(GURL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'openai/gpt-oss-20b',reasoning_effort:'low',messages:[{role:'system',content:'You are Jarvis, a friendly voice assistant. Reply in one or two short sentences, plain text only.'},{role:'user',content:q}]})});
  if(r.status==401){localStorage.removeItem('gk');throw new Error('Key rejected. Tap again to re-enter it.')}
  const d=await r.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'No answer.';
}
</script>
<script>
out.style.whiteSpace='pre-line';
document.getElementById('talk').onclick=async()=>{
  if(!SR){out.textContent='Speech plugin not found.';return}
  try{
    await SR.requestPermissions();
    out.textContent='Listening...';
    const r=await SR.start({language:'en-US',maxResults:1,prompt:'Ask Jarvis',partialResults:false,popup:true});
    const heard=(r&&r.matches&&r.matches[0])||'';
    if(!heard){out.textContent='I heard nothing.';return}
    out.textContent='You: '+heard+'\nThinking...';
    const ans=await brain(heard);
    out.textContent='You: '+heard+'\nJarvis: '+ans;
    say(ans);
  }catch(e){out.textContent='Error: '+(e.message||e)}
};
</script>
<script>
const _brain0=brain;
brain=async function(q){
  const l=q.toLowerCase();
  const P=window.Capacitor.Plugins;
  try{
    if(l.includes('vibrate')){await P.Haptics.vibrate({duration:500});return 'Buzz buzz.'}
    if(l.includes('battery')){const b=await P.Device.getBatteryInfo();return 'Your battery is at '+Math.round((b.batteryLevel||0)*100)+' percent.'}
    if(l.includes('what time')||l.includes('the time')){return 'The time is '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'.'}
    if(l.startsWith('play ')){const t=l.slice(5).trim();await P.AppLauncher.openUrl({url:'https://www.youtube.com/results?search_query='+encodeURIComponent(t)});return 'Searching YouTube for '+t+'.'}
  }catch(e){return 'That action failed: '+(e.message||e)}
  return _brain0(q);
};
</script><script>
const _brain1=brain;
brain=async function(q){
  const l=q.toLowerCase();
  if(l.includes('volume')){
    const V=window.Capacitor.Plugins.VolumeControl;
    if(!V) return 'Volume plugin not found.';
    let v=null;
    const m=l.match(/\d+/);
    if(m) v=Math.min(parseInt(m[0],10),100)/100;
    else if(l.includes('max')||l.includes('full')) v=1;
    else if(l.includes('mute')) v=0;
    if(v===null) return 'Say volume with a number from 0 to 100.';
    try{await V.setVolumeLevel({value:v});return 'Volume set to '+Math.round(v*100)+' percent.'}
    catch(e){return 'Volume failed: '+(e.message||e)}
  }
  return _brain1(q);
};
</script><script>
const _brain2=brain;
brain=async function(q){
  const l=q.toLowerCase();
  const m=l.match(/remind me in (\d+)\s*(second|minute|hour)s?\s*(?:to|that)?\s*(.*)/);
  if(m){
    const LN=window.Capacitor.Plugins.LocalNotifications;
    if(!LN) return 'Reminder plugin not found.';
    const n=parseInt(m[1],10);
    const ms=n*({second:1000,minute:60000,hour:3600000}[m[2]]);
    const what=(m[3]||'').trim()||'your reminder';
    try{
      const p=await LN.requestPermissions();
      if(p.display!=='granted') return 'Please allow notifications for Jarvis, then ask again.';
      await LN.schedule({notifications:[{id:Date.now()%2147483647,title:'Jarvis reminder',body:what,schedule:{at:new Date(Date.now()+ms),allowWhileIdle:true}}]});
      return 'Okay, I will remind you in '+n+' '+m[2]+(n>1?'s':'')+' to '+what+'.';
    }catch(e){return 'Reminder failed: '+(e.message||e)}
  }
  return _brain2(q);
};
    </script>
<script>
document.getElementById('talk').style.display='none';
let running=false,paused=false,convoUntil=0;
const WAKE=/\b(jarvis|computer|assistant)\b/i;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(t){
  const T=window.Capacitor.Plugins.TextToSpeech;
  if(!T){out.textContent='Voice plugin not found.';return Promise.resolve()}
  return T.speak({text:t,lang:'en-US',rate:1.0,pitch:1.0,volume:1.0}).catch(e=>{out.textContent='Speak error: '+(e.message||e)});
}
async function turn(){
  setS('listening');
  let heard='';
  try{
    const r=await window.Capacitor.Plugins.SpeechRecognition.start({language:'en-US',maxResults:1,prompt:'Say hello Jarvis',partialResults:false,popup:true});
    heard=(r&&r.matches&&r.matches[0])||'';
  }catch(e){await wait(2000);return}
  if(!heard)return;
  if(!WAKE.test(heard)&&Date.now()>convoUntil){out.textContent='Asleep. Say hello Jarvis.\n(Heard: '+heard+')';return}
  const q=heard.replace(WAKE,'').replace(/^[\s,.]+/,'').trim()||'hello';
  if(/stop listening/i.test(q)){paused=true;out.textContent='Paused. Tap the face to resume.';setS('');await say('Okay, pausing.');return}
  if(/goodbye|good bye|go to sleep/i.test(q)){convoUntil=0;out.textContent='Sleeping. Say hello Jarvis to wake me.';setS('');await say('Goodbye. Say hello Jarvis to wake me.');return}
  out.textContent='You: '+q+'\nThinking...';setS('thinking');
  let a;try{a=await brain(q)}catch(e){a='Error: '+(e.message||e)}
  out.textContent='You: '+q+'\nJarvis: '+a;setS('speaking');
  await say(a);convoUntil=Date.now()+180000;
}
    </script>
<script>
async function loop(){
  if(running)return;running=true;
  try{await window.Capacitor.Plugins.SpeechRecognition.requestPermissions()}catch(e){}
  while(!paused){await turn();await wait(300)}
  running=false;
}
document.getElementById('hud').onclick=()=>{if(paused){paused=false;loop()}};
setTimeout(loop,1500);
</script>
<style>
.core{display:none}
body{--c:#1e5bff;--p:3s}
body.listening{--c:#00e5a0;--p:1.2s}
body.thinking{--c:#ffb020;--p:.6s}
body.speaking{--c:#4aa8ff;--p:.35s}
#hud{width:min(72vw,340px);height:min(72vw,340px);stroke:var(--c);filter:drop-shadow(0 0 8px var(--c))}
#hud .d{fill:var(--c)}
#hud .f{fill:var(--c);fill-opacity:.25}
#hud .a,#hud .b,#hud .h{transform-box:view-box;transform-origin:100px 100px}
#hud .a{animation:rot 24s linear infinite}
#hud .b{animation:rot 16s linear infinite reverse}
#hud .h{animation:pul var(--p) ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pul{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.08);opacity:1}}
</style>

<script>
const _brain3=brain;
brain=async function(q){
  const l=q.toLowerCase().trim();
  let mem=[];
  try{mem=JSON.parse(localStorage.getItem('mem')||'[]')}catch(e){}
  const save=()=>{try{localStorage.setItem('mem',JSON.stringify(mem.slice(-30)))}catch(e){}};
  if(/^(please )?remember( that)? /.test(l)){
    const f=q.replace(/^(please )?remember( that)? /i,'').trim();
    if(!f)return 'What should I remember?';
    mem.push(f);save();return 'Okay, I will remember that.';
  }
  if(/what do you remember|what did i tell you/.test(l))return mem.length?('I remember: '+mem.slice(-10).join('. ')+'.'):'I do not remember anything yet.';
  if(/forget everything|clear (your )?memory/.test(l)){mem=[];save();return 'Okay, I have forgotten everything.'}
  const ACT=/vibrate|battery|what time|the time|^play |volume|remind me in/;
  if(mem.length&&!ACT.test(l))return _brain0('Facts the user told you earlier (use them if relevant): '+mem.slice(-20).join('. ')+'. The user now says: '+q);
  return _brain3(q);
};
</script>

<script>
const _brain4=brain;
brain=async function(q){
  const l=q.toLowerCase().trim();
  const num=s=>{const d=s.replace(/[\s\-().]/g,'');return /^\+?\d{5,15}$/.test(d)?d:null};
  const AL=window.Capacitor.Plugins.AppLauncher;
  let m=l.match(/^(?:call|phone|dial)\s+(.+)$/);
  if(m&&num(m[1])){
    try{await AL.openUrl({url:'tel:'+num(m[1])});return 'Opening the dialer. Tap call to confirm.'}
    catch(e){return 'Could not open the dialer: '+(e.message||e)}
  }
  m=q.match(/^(?:text|message|sms)\s+(.+?)\s+(?:saying|that says|and say|say)\s+(.+)$/i);
  if(m&&num(m[1])){
    try{await AL.openUrl({url:'sms:'+num(m[1])+'?body='+encodeURIComponent(m[2])});return 'Opening messages. Tap send to confirm.'}
    catch(e){return 'Could not open messages: '+(e.message||e)}
  }
  return _brain4(q);
};
</script>

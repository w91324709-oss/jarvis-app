name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - name: Re-sign with my key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p signed
          "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out signed/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs signed/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: signed/app-debug.apk
